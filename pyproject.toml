[tool.poetry]
name = "pyfinq"
version = "0.5.0"
description = "🔬 Quantitative analysis and management for financial applications. "
authors = [
    "Wilhelm Ågren <wilhelmagren98@gmail.com>",
]
license = "MIT"
readme = "README.md"

packages = [ {include = "finq" }]
homepage = "https://github.com/wilhelmagren/finq"
repository = "https://github.com/wilhelmagren/finq"
keywords = [
    "finance",
    "nasdaq",
    "investment",
    "yahoo-finance",
    "data-science",
    "time-series",
    "analysis",
    "optimization",
    "data-analysis",
    "quantiative-finance",
    "portfolio-optimization",
    "portfolio-management",
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[tool.poetry.urls]
"Homepage" = "https://github.com/wilhelmagren/finq"
"Bug tracker" = "https://github.com/wilhelmagren/finq/issues"

# Requirements
[tool.poetry.dependencies]
python = ">=3.9,<3.13"


[tool.poetry.group.dev]
optional = true

# Dev/test requirements
[tool.poetry.group.dev.dependencies]
pyclean = "^2.7.5"
black = "^23.9.1"
ruff = ">=0.0.292,<0.2.1"
pre-commit = "^3.5.0"

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 89
ignore = [
    "E401",  # unused imports, we do this in submodule __init__.py files
    "E501",  # line too long error, handled by black
    "E722",  # bare `except`
    "E731",  # do not assign a `lambda` expression, use a `def`
]

[tool.black]
target-version = [ "py310" ]
line-length = 89

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
